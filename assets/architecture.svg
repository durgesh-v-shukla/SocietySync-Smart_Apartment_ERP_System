<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="860" height="320">
  <defs>
    <style>
      text { font-family: 'Segoe UI', sans-serif; }
      .layer-label { font-size: 11px; font-weight: bold; fill: #374151; }
      .box-title   { font-size: 10px; font-weight: bold; fill: #1f2937; }
      .box-sub     { font-size: 8px;  fill: #6b7280; }
      .arrow-anim  { stroke-dasharray: 8 4; animation: flow 1.5s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -24; } }
      .pulse-box   { animation: boxpulse 3s ease-in-out infinite; }
      @keyframes boxpulse { 0%,100%{opacity:1} 50%{opacity:0.7} }
    </style>
  </defs>

  <rect width="860" height="320" fill="#f9fafb" rx="10" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- Layer 1: Users -->
  <rect x="10" y="12" width="840" height="78" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="20" y="28" class="layer-label">① USER LAYER</text>

  <!-- Admin -->
  <rect x="20" y="34" width="150" height="48" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="95" y="52" text-anchor="middle" class="box-title">👤 ADMIN</text>
  <text x="95" y="65" text-anchor="middle" class="box-sub">Full system access</text>
  <text x="95" y="75" text-anchor="middle" class="box-sub">role = 'admin'</text>

  <!-- Owner -->
  <rect x="355" y="34" width="150" height="48" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
  <text x="430" y="52" text-anchor="middle" class="box-title">🏠 OWNER</text>
  <text x="430" y="65" text-anchor="middle" class="box-sub">Flat owner / resident</text>
  <text x="430" y="75" text-anchor="middle" class="box-sub">role = 'owner'</text>

  <!-- Tenant -->
  <rect x="690" y="34" width="150" height="48" rx="6" fill="#ffedd5" stroke="#f97316" stroke-width="1.2"/>
  <text x="765" y="52" text-anchor="middle" class="box-title">🧑‍💼 TENANT</text>
  <text x="765" y="65" text-anchor="middle" class="box-sub">Renter / occupant</text>
  <text x="765" y="75" text-anchor="middle" class="box-sub">role = 'tenant'</text>

  <!-- Arrows L1 → L2 -->
  <line x1="95"  y1="82" x2="95"  y2="106" stroke="#3b82f6" stroke-width="1.5" class="arrow-anim" stroke-dashoffset="0"/>
  <line x1="430" y1="82" x2="430" y2="106" stroke="#22c55e" stroke-width="1.5" class="arrow-anim" stroke-dashoffset="4"/>
  <line x1="765" y1="82" x2="765" y2="106" stroke="#f97316" stroke-width="1.5" class="arrow-anim" stroke-dashoffset="8"/>

  <!-- Layer 2: App -->
  <rect x="10" y="102" width="840" height="88" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="20" y="118" class="layer-label">② APPLICATION LAYER — Python 3 / Streamlit</text>

  <!-- app modules -->
  <rect x="18"  y="124" width="90"  height="56" rx="5" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1"/>
  <text x="63"  y="141" text-anchor="middle" class="box-title">auth.py</text>
  <text x="63"  y="153" text-anchor="middle" class="box-sub">Login/logout</text>
  <text x="63"  y="162" text-anchor="middle" class="box-sub">bcrypt verify</text>
  <text x="63"  y="172" text-anchor="middle" class="box-sub">Sessions</text>

  <rect x="116" y="124" width="130" height="56" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="181" y="141" text-anchor="middle" class="box-title">admin_dashboard.py</text>
  <text x="181" y="153" text-anchor="middle" class="box-sub">Users, bills, complaints</text>
  <text x="181" y="162" text-anchor="middle" class="box-sub">Notifications, polls</text>
  <text x="181" y="172" text-anchor="middle" class="box-sub">Visitors, statistics</text>

  <rect x="254" y="124" width="130" height="56" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="319" y="141" text-anchor="middle" class="box-title">owner_dashboard.py</text>
  <text x="319" y="153" text-anchor="middle" class="box-sub">Bills, complaints</text>
  <text x="319" y="162" text-anchor="middle" class="box-sub">Polls, notifications</text>
  <text x="319" y="172" text-anchor="middle" class="box-sub">Manage tenants</text>

  <rect x="392" y="124" width="130" height="56" rx="5" fill="#ffedd5" stroke="#f97316" stroke-width="1"/>
  <text x="457" y="141" text-anchor="middle" class="box-title">tenant_dashboard.py</text>
  <text x="457" y="153" text-anchor="middle" class="box-sub">Lease details</text>
  <text x="457" y="162" text-anchor="middle" class="box-sub">Bills, complaints</text>
  <text x="457" y="172" text-anchor="middle" class="box-sub">Polls, notifications</text>

  <rect x="530" y="124" width="90"  height="56" rx="5" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
  <text x="575" y="141" text-anchor="middle" class="box-title">utils.py</text>
  <text x="575" y="153" text-anchor="middle" class="box-sub">Overdue detect</text>
  <text x="575" y="162" text-anchor="middle" class="box-sub">Notifications</text>
  <text x="575" y="172" text-anchor="middle" class="box-sub">N+1 prevention</text>

  <rect x="628" y="124" width="110" height="56" rx="5" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1"/>
  <text x="683" y="141" text-anchor="middle" class="box-title">database.py</text>
  <text x="683" y="153" text-anchor="middle" class="box-sub">Singleton (cached)</text>
  <text x="683" y="162" text-anchor="middle" class="box-sub">RealDictCursor</text>
  <text x="683" y="172" text-anchor="middle" class="box-sub">SQL whitelist</text>

  <rect x="746" y="124" width="96"  height="56" rx="5" fill="#f4f4f5" stroke="#71717a" stroke-width="1"/>
  <text x="794" y="141" text-anchor="middle" class="box-title">config.py</text>
  <text x="794" y="153" text-anchor="middle" class="box-sub">DATABASE_URL</text>
  <text x="794" y="162" text-anchor="middle" class="box-sub">Col whitelists</text>
  <text x="794" y="172" text-anchor="middle" class="box-sub">Constants</text>

  <!-- Arrows L2 → L3 (from database.py center) -->
  <line x1="430" y1="190" x2="430" y2="210" stroke="#6b7280" stroke-width="1.5" class="arrow-anim" stroke-dashoffset="0"/>

  <!-- Layer 3: DB -->
  <rect x="10" y="206" width="840" height="102" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="20" y="222" class="layer-label">③ DATABASE LAYER — PostgreSQL (societysync)</text>

  <!-- DB tables -->
  <g>
    <!-- USERS -->
    <rect x="18"  y="228" width="88" height="68" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="62"  y="241" text-anchor="middle" class="box-title">USERS</text>
    <line x1="18" y1="245" x2="106" y2="245" stroke="#3b82f6" stroke-width="0.5"/>
    <text x="62"  y="257" text-anchor="middle" class="box-sub">PK user_id</text>
    <text x="62"  y="267" text-anchor="middle" class="box-sub">username UNIQUE</text>
    <text x="62"  y="277" text-anchor="middle" class="box-sub">role, flat, name</text>
    <text x="62"  y="287" text-anchor="middle" class="box-sub">13 columns total</text>

    <!-- OWNERS -->
    <rect x="114" y="228" width="88" height="68" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
    <text x="158" y="241" text-anchor="middle" class="box-title">OWNERS</text>
    <line x1="114" y1="245" x2="202" y2="245" stroke="#22c55e" stroke-width="0.5"/>
    <text x="158" y="257" text-anchor="middle" class="box-sub">PK owner_id</text>
    <text x="158" y="267" text-anchor="middle" class="box-sub">FK user_id</text>
    <text x="158" y="277" text-anchor="middle" class="box-sub">flat, start_date</text>
    <text x="158" y="287" text-anchor="middle" class="box-sub">CASCADE delete</text>

    <!-- TENANTS -->
    <rect x="210" y="228" width="88" height="68" rx="4" fill="#ffedd5" stroke="#f97316" stroke-width="1"/>
    <text x="254" y="241" text-anchor="middle" class="box-title">TENANTS</text>
    <line x1="210" y1="245" x2="298" y2="245" stroke="#f97316" stroke-width="0.5"/>
    <text x="254" y="257" text-anchor="middle" class="box-sub">PK tenant_id</text>
    <text x="254" y="267" text-anchor="middle" class="box-sub">FK user_id</text>
    <text x="254" y="277" text-anchor="middle" class="box-sub">FK owner_id</text>
    <text x="254" y="287" text-anchor="middle" class="box-sub">lease, rent, deposit</text>

    <!-- BILLS -->
    <rect x="306" y="228" width="88" height="68" rx="4" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
    <text x="350" y="241" text-anchor="middle" class="box-title">BILLS</text>
    <line x1="306" y1="245" x2="394" y2="245" stroke="#ec4899" stroke-width="0.5"/>
    <text x="350" y="257" text-anchor="middle" class="box-sub">PK bill_id</text>
    <text x="350" y="267" text-anchor="middle" class="box-sub">flat, type, amount</text>
    <text x="350" y="277" text-anchor="middle" class="box-sub">payment_status</text>
    <text x="350" y="287" text-anchor="middle" class="box-sub">FK created_by</text>

    <!-- COMPLAINTS -->
    <rect x="402" y="228" width="88" height="68" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
    <text x="446" y="241" text-anchor="middle" class="box-title">COMPLAINTS</text>
    <line x1="402" y1="245" x2="490" y2="245" stroke="#ef4444" stroke-width="0.5"/>
    <text x="446" y="257" text-anchor="middle" class="box-sub">PK complaint_id</text>
    <text x="446" y="267" text-anchor="middle" class="box-sub">FK user_id</text>
    <text x="446" y="277" text-anchor="middle" class="box-sub">priority, status</text>
    <text x="446" y="287" text-anchor="middle" class="box-sub">12 columns total</text>

    <!-- POLLS -->
    <rect x="498" y="228" width="88" height="68" rx="4" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1"/>
    <text x="542" y="241" text-anchor="middle" class="box-title">POLLS</text>
    <line x1="498" y1="245" x2="586" y2="245" stroke="#0ea5e9" stroke-width="0.5"/>
    <text x="542" y="257" text-anchor="middle" class="box-sub">PK poll_id</text>
    <text x="542" y="267" text-anchor="middle" class="box-sub">FK created_by</text>
    <text x="542" y="277" text-anchor="middle" class="box-sub">status: active|closed</text>
    <text x="542" y="287" text-anchor="middle" class="box-sub">+ POLL_OPTIONS</text>

    <!-- VOTES -->
    <rect x="594" y="228" width="88" height="68" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="1"/>
    <text x="638" y="241" text-anchor="middle" class="box-title">VOTES</text>
    <line x1="594" y1="245" x2="682" y2="245" stroke="#e11d48" stroke-width="0.5"/>
    <text x="638" y="257" text-anchor="middle" class="box-sub">PK vote_id</text>
    <text x="638" y="267" text-anchor="middle" class="box-sub">FK poll_id (CASCADE)</text>
    <text x="638" y="277" text-anchor="middle" class="box-sub">FK option_id</text>
    <text x="638" y="287" text-anchor="middle" class="box-sub">UNIQUE(poll, user)</text>

    <!-- VISITORS + NOTIFICATIONS -->
    <rect x="690" y="228" width="80" height="30" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
    <text x="730" y="247" text-anchor="middle" class="box-title">VISITORS</text>

    <rect x="690" y="265" width="80" height="30" rx="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
    <text x="730" y="284" text-anchor="middle" class="box-title">NOTIFICATIONS</text>

    <rect x="778" y="228" width="64" height="30" rx="4" fill="#f3e8ff" stroke="#a855f7" stroke-width="1"/>
    <text x="810" y="247" text-anchor="middle" class="box-sub">NOTIF</text>
    <text x="810" y="257" text-anchor="middle" class="box-sub">READS</text>

    <rect x="778" y="265" width="64" height="30" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
    <text x="810" y="284" text-anchor="middle" class="box-sub">10 tables</text>
    <text x="810" y="294" text-anchor="middle" class="box-sub">total</text>
  </g>

  <!-- Animated FK relationship indicators -->
  <line x1="62" y1="296" x2="158" y2="296" stroke="#6b7280" stroke-width="1" class="arrow-anim" stroke-dashoffset="0" opacity="0.5"/>
  <line x1="158" y1="296" x2="254" y2="296" stroke="#6b7280" stroke-width="1" class="arrow-anim" stroke-dashoffset="4" opacity="0.5"/>
  <line x1="542" y1="296" x2="638" y2="296" stroke="#6b7280" stroke-width="1" class="arrow-anim" stroke-dashoffset="8" opacity="0.5"/>
  <text x="430" y="310" text-anchor="middle" font-size="8" fill="#9ca3af">→ All FKs with referential integrity · CASCADE deletes · UNIQUE constraints · CHECK constraints</text>
</svg>
